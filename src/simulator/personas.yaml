# ═══════════════════════════════════════════════════════════════════
# JB금융 도메인 매핑
# ───────────────────────────────────────────────────────────────────
# 본 파일의 페르소나 키 이름은 의사결정 엔진의 도메인 비종속 식별자다.
# 실제 JB금융그룹 마케팅 시나리오에서는 아래와 같이 매핑된다.
#
# vip_loyal          → WM 우수고객 (예치자산 1억+, 거래활성 상위 10%)
# regular_loyal      → 주거래 안정고객 (급여이체 + 자동이체 + 3개 이상 상품)
# price_sensitive    → 금리민감 고객 (만기마다 타행 비교, 우대금리 강반응)
# explorer           → 신규 디지털 유입 (앱 다운로드 후 1~2개 상품만 체험)
# churn_progressing  → 이탈 진행 고객 (잔액 감소·거래 빈도 급감, 골든타임)
# new_signup         → 신규가입 90일 이내 (온보딩, 첫 거래 유도 구간)
#
# Uplift 세그먼트:
# persuadable        → 캠페인 받으면 거래, 안 받으면 이탈 (★ 최우선 타겟)
# sure_thing         → 캠페인 유무 무관하게 거래 (발송 제외 — 가성비 없음)
# lost_cause         → 캠페인 받아도 거래 안 함 (발송 제외)
# sleeping_dog       → 캠페인 받으면 오히려 이탈 (발송 절대 금지 — 역효과)
#
# 변수 매핑 (대표):
# monetary           → 금융자산 잔액 (예적금+펀드+대출잔액의 가중합)
# frequency          → 월평균 거래 건수 (출금·이체·결제·가입 통합)
# recency_days       → 마지막 거래로부터 경과일
# avg_order_value    → 건당 평균 거래금액
# coupon_affinity    → 마케팅 반응성 (과거 캠페인 클릭률)
# price_sensitivity  → 금리 민감도 (만기 이탈·타행 송금 빈도)
# churn_sensitivity  → 이탈 민감도 (잔액 변동 변동성)
# treatment_lift     → 캠페인 처치 효과 (우대금리 발송 시 거래 상승 정도)
# coupon_open        → 마케팅 알림 열람 (앱 푸시 / 카톡 / 이메일)
# coupon_redeem      → 우대금리·쿠폰 코드 사용
#
# 페르소나 가중치(acquisition_weight)는 JB금융 고객 분포 가정을 반영한 값으로,
# 실데이터 적용 시 어댑터에서 재캘리브레이션된다.
# ═══════════════════════════════════════════════════════════════════

